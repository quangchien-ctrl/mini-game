<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỒ SƠ GỌI TÊN AI? - QUẢN LÝ HỆ THỐNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            overflow: hidden;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
        }

        /* Sidebar bên trái cho Lịch sử */
        .history-panel {
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            width: 400px;
        }

        .config-area {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .result-area {
            background: #f8fafc;
        }

        .empty-slot {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }

        .filled-slot {
            background: #ffffff;
            border: 1px solid #10b981;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.1);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shimmer {
            position: relative;
            overflow: hidden;
            background: #ecfdf5 !important;
        }
        .shimmer::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: shimmerEffect 1s infinite;
        }

        @keyframes shimmerEffect {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .tab-btn.active {
            color: #059669;
            background: #ecfdf5;
            border-radius: 8px;
        }

        .stat-card {
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            min-width: 120px;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- LOGIN OVERLAY -->
<div id="loginBox" style="
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
">
    <div style="
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    text-align:center;
    color:white;
    width:320px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    ">
        <h2 style="font-size:22px;font-weight:bold;margin-bottom:20px;">🔐 Đăng nhập hệ thống</h2>
        
        <input id="user" placeholder="Username"
        style="width:100%;margin:10px 0;padding:12px;border-radius:10px;border:none;outline:none;">
        
        <input id="pass" type="password" placeholder="Password"
        style="width:100%;margin:10px 0;padding:12px;border-radius:10px;border:none;outline:none;">
        
        <button onclick="login()" 
        style="margin-top:15px;padding:12px 20px;border:none;border-radius:10px;background:#10b981;color:white;font-weight:bold;width:100%;">
            Đăng nhập
        </button>
    </div>
</div>

    <!-- Header với Dashboard 03 thông tin -->
    <header class="glass-header py-3 px-6 flex justify-between items-center shrink-0 z-50">
        <div class="flex items-center gap-8">
            <h1 class="text-lg font-black text-emerald-600 uppercase tracking-tighter">HỒ SƠ GỌI TÊN AI?</h1>
            <nav class="flex gap-2">
                <button onclick="switchTab('draw')" id="tab-draw" class="tab-btn active px-4 py-2 font-bold text-[11px] uppercase tracking-widest transition-all">Quay chọn</button>
                <button onclick="switchTab('manage')" id="tab-manage" class="tab-btn px-4 py-2 font-bold text-[11px] uppercase tracking-widest text-slate-400 transition-all">Quản lý kho hồ sơ</button>
            </nav>
        </div>

        <!-- Dashboard Areas -->
        <div class="flex items-center gap-4">
            <div class="stat-card bg-white">
                <div class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">1. Tổng số hồ sơ</div>
                <div id="stat-total" class="text-sm font-black text-slate-700">0</div>
            </div>
            <div class="stat-card bg-emerald-50 border-emerald-100">
                <div class="text-[9px] text-emerald-600 font-bold uppercase tracking-wider">2. Còn khả dụng</div>
                <div id="stat-remaining" class="text-sm font-black text-emerald-700">0</div>
            </div>
            <div class="stat-card bg-slate-900 border-slate-800">
                <div class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">3. Đã quay chọn</div>
                <div id="stat-drawn" class="text-sm font-black text-white">0</div>
            </div>
            <div class="w-px h-8 bg-slate-200 mx-2"></div>
            <button onclick="resetApp()" class="text-[10px] font-bold text-red-400 hover:text-red-600 uppercase transition-colors">Làm mới phiên</button>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        
        <!-- BÊN TRÁI: LỊCH SỬ CHI TIẾT -->
        <aside class="history-panel flex flex-col shrink-0 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-white">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-bold text-slate-700 uppercase tracking-widest text-[10px]">Lịch sử chi tiết</h2>
                    <span id="history-total-label" class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-[9px] font-bold">0</span>
                </div>
                <div class="relative">
                    <input type="text" id="search-history" onkeyup="updateHistoryList()" placeholder="Lọc tên, đơn vị, người quay..." 
                        class="w-full p-2.5 pl-9 bg-slate-50 border border-slate-200 rounded-xl text-[11px] outline-none focus:border-emerald-400 transition-all">
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
            
            <div class="flex-1 overflow-auto custom-scrollbar">
                <table class="w-full text-left table-fixed border-collapse">
                    <thead class="sticky top-0 bg-slate-50 z-20">
                        <tr class="text-[9px] text-slate-400 uppercase tracking-wider">
                            <th class="p-3 w-10 text-center">#</th>
                            <th class="p-3 w-32">Hồ sơ</th>
                            <th class="p-3 w-28">Người quay</th>
                            <th class="p-3 w-16 text-right">Giờ</th>
                        </tr>
                    </thead>
                    <tbody id="history-body" class="text-[10px] divide-y divide-slate-50">
                    </tbody>
                </table>
            </div>
        </aside>

        <!-- BÊN PHẢI: VÙNG THAO TÁC -->
        <div class="flex-1 flex flex-col overflow-hidden">
            
            <div id="view-draw" class="flex flex-col h-full overflow-hidden">
                
                <!-- VÙNG TRÊN: CẤU HÌNH LƯỢT QUAY -->
                <section class="config-area p-6 shrink-0 shadow-sm z-10">
                    <div class="max-w-4xl mx-auto space-y-4">
                        <div class="flex gap-6">
                            <!-- Người thực hiện -->
                            <div class="flex-1 space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Người thực hiện</label>
                                <select id="current-picker" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 outline-none focus:ring-2 ring-emerald-100 transition-all">
                                    <option>Đỗ Quang Chiến</option>
                                    <option>Đỗ Thị Thúy Hằng</option>
                                    <option>Trịnh Hoài ÂN</option>
                                    <option>Trần Thị Kim Ngân</option>
                                    <option>Trần Hoài Bảo</option>
                                    <option>Đàm Thu Trang</option>
                                </select>
                            </div>
                            <!-- Số hồ sơ/lượt -->
                            <div class="w-40 space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hồ sơ / lượt</label>
                                <div class="relative">
                                    <input type="number" id="winners-count" value="5" min="1" max="20" onchange="generateEmptySlots()" 
                                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-center text-emerald-600 font-black text-lg outline-none">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Nút Bắt đầu quay chuyển xuống 1 dòng -->
                        <div class="pt-2">
                            <button id="spin-btn" onclick="startDrawing()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 px-10 rounded-xl text-base shadow-lg shadow-emerald-100 transition-all active:scale-[0.98] disabled:opacity-50 uppercase tracking-widest">
                                Bắt đầu quay
                            </button>
                        </div>
                    </div>
                </section>

                <!-- VÙNG DƯỚI: KẾT QUẢ MAY MẮN -->
                <section class="result-area flex-1 flex flex-col p-8 overflow-hidden">
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-6 bg-emerald-500 rounded-full"></div>
                            <h2 class="text-xl font-black text-slate-800 uppercase tracking-tight">Kết quả may mắn</h2>
                        </div>
                        <div id="draw-info" class="hidden text-right bg-white px-4 py-2 rounded-lg border border-slate-200">
                            <span id="draw-date" class="text-emerald-600 font-bold text-xs mr-3"></span>
                            <span id="draw-time" class="text-slate-400 font-bold text-xs"></span>
                        </div>
                    </div>

                    <div id="winners-grid" class="flex-1 overflow-y-auto custom-scrollbar grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 content-start">
                    </div>

                    <div id="after-draw-controls" class="hidden flex justify-center gap-4 py-6 border-t border-slate-200 mt-6">
                        <button onclick="confirmAndDownload()" class="bg-slate-800 text-white font-bold py-3 px-8 rounded-xl text-[11px] uppercase tracking-widest hover:bg-slate-700 transition-all shadow-md">Xuất file kết quả</button>
                        <button onclick="generateEmptySlots()" class="bg-white text-emerald-600 border border-emerald-200 font-bold py-3 px-8 rounded-xl text-[11px] uppercase tracking-widest hover:bg-emerald-50 transition-all">Tiếp tục lượt mới</button>
                    </div>
                </section>
            </div>

            <!-- VIEW: QUẢN LÝ KHO -->
            <div id="view-manage" class="hidden h-full p-8 overflow-hidden flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black text-slate-800 uppercase tracking-tighter">Kho hồ sơ khả dụng</h3>
                    <div class="flex gap-2">
                        <input type="file" id="csv-upload" accept=".csv" class="hidden" onchange="handleCsvUpload(event)">
                        <button onclick="document.getElementById('csv-upload').click()" class="bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-xl font-bold text-[10px] uppercase tracking-widest hover:bg-slate-50 transition-all flex items-center gap-2">Nhập Excel (CSV)</button>
                        <button onclick="toggleAddForm()" class="bg-emerald-600 text-white px-5 py-2 rounded-xl font-bold text-[10px] uppercase hover:bg-emerald-500 shadow-md">Thêm mới</button>
                    </div>
                </div>

                <div id="add-form" class="hidden bg-white border border-slate-200 p-6 rounded-2xl mb-6 shadow-sm">
                    <div class="grid grid-cols-3 gap-4">
                        <input type="text" id="new-id" placeholder="Mã hồ sơ" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-400">
                        <input type="text" id="new-name" placeholder="Họ và tên" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-400">
                        <input type="text" id="new-dept" placeholder="Đơn vị" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-400">
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button onclick="toggleAddForm()" class="text-slate-400 text-xs font-bold px-4">Đóng</button>
                        <button onclick="addNewPersonnel()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl text-xs font-bold uppercase">Lưu hồ sơ</button>
                    </div>
                </div>

                <div class="flex-1 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden flex flex-col">
                    <div class="p-4 bg-slate-50/50 border-b border-slate-100">
                        <input type="text" id="search-manage" onkeyup="renderManageTable()" placeholder="Tìm nhanh trong kho..." class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs outline-none">
                    </div>
                    <div class="flex-1 overflow-auto custom-scrollbar">
                        <table class="w-full text-left border-collapse">
                            <thead class="sticky top-0 bg-white z-10 border-b border-slate-100">
                                <tr class="text-[9px] text-slate-400 uppercase font-bold tracking-widest">
                                    <th class="p-4 w-16 text-center">STT</th>
                                    <th class="p-4">Mã số</th>
                                    <th class="p-4">Họ và tên</th>
                                    <th class="p-4">Đơn vị</th>
                                    <th class="p-4 text-center">Xóa</th>
                                </tr>
                            </thead>
                            <tbody id="manage-body" class="text-xs text-slate-600 font-medium"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Dữ liệu ban đầu
        const sampleData = `Mã,Họ Tên,Đơn Vị
QSX7301905,LÊ THỊ NGỌC ĐIỆP,Văn phòng Đảng ủy
QSX7400068,NGÔ THỊ PHƯƠNG LAN,Ban Giám hiệu
QSX6611600,PHAN THANH ĐỊNH,Ban Giám hiệu
QSX7712508,LÊ HOÀNG DŨNG,Ban Giám hiệu
QSX8010601,LƯU VĂN QUYẾT,Ban Giám hiệu
QSX9410055,LÂM HOÀI BÁCH CÁT,Khoa Báo chí
QSX8410140,NGUYỄN QUANG DŨNG,Khoa Báo chí
QSX9611718,NGUYỄN TRẦN PHÚC DUY,Khoa Báo chí
QSX8210796,HỒ QUANG TRINH,Văn phòng Công đoàn
QSX0201723,VŨ THỊ THU HÀ,Văn phòng Đoàn TN`;

        let originalPoolSize = 0; 
        let pool = []; 
        let historyData = [];
        let lastWinners = [];
        let isDrawing = false;

        function init() {
            const lines = sampleData.trim().split('\n');
            pool = lines.slice(1).map(line => {
                const cols = line.split(',');
                return { id: cols[0], name: cols[1], dept: cols[2] };
            });
            originalPoolSize = pool.length;
            updateStats();
            generateEmptySlots();
            updateHistoryList();
            renderManageTable();
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = pool.length + historyData.length;
            document.getElementById('stat-remaining').innerText = pool.length;
            document.getElementById('stat-drawn').innerText = historyData.length;
            document.getElementById('history-total-label').innerText = historyData.length;
        }

        function switchTab(tab) {
            document.getElementById('view-draw').classList.toggle('hidden', tab !== 'draw');
            document.getElementById('view-manage').classList.toggle('hidden', tab !== 'manage');
            document.getElementById('tab-draw').classList.toggle('active', tab === 'draw');
            document.getElementById('tab-manage').classList.toggle('active', tab === 'manage');
            if(tab === 'manage') renderManageTable();
        }

        function generateEmptySlots() {
            if (isDrawing) return;
            const count = parseInt(document.getElementById('winners-count').value) || 5;
            const grid = document.getElementById('winners-grid');
            grid.innerHTML = '';
            document.getElementById('after-draw-controls').classList.add('hidden');
            document.getElementById('spin-btn').classList.remove('hidden');
            document.getElementById('draw-info').classList.add('hidden');
            
            for (let i = 0; i < count; i++) {
                const div = document.createElement('div');
                div.className = 'empty-slot rounded-2xl p-6 h-28 flex flex-col items-center justify-center text-slate-300 font-bold';
                div.innerHTML = `<span class="text-[10px] uppercase tracking-widest opacity-50">Sẵn sàng</span><span class="text-lg">#${i + 1}</span>`;
                grid.appendChild(div);
            }
        }

        async function startDrawing() {
            if (isDrawing || pool.length === 0) return pool.length === 0 && alert("Kho hồ sơ khả dụng đã hết!");
            const count = Math.min(parseInt(document.getElementById('winners-count').value) || 5, pool.length);
            const picker = document.getElementById('current-picker').value;
            
            isDrawing = true;
            lastWinners = [];
            document.getElementById('spin-btn').disabled = true;
            
            const slots = document.querySelectorAll('#winners-grid > div');
            const now = new Date();
            const timeStr = now.toLocaleTimeString('vi-VN', { hour12: false });
            const dateStr = now.toLocaleDateString('vi-VN');

            for (let i = 0; i < count; i++) {
                slots[i].classList.add('shimmer');
                await new Promise(r => setTimeout(r, 400 + Math.random() * 500));
                
                const idx = Math.floor(Math.random() * pool.length);
                const winner = pool.splice(idx, 1)[0];
                lastWinners.push(winner);
                historyData.push({ ...winner, picker, date: dateStr, time: timeStr });

                slots[i].classList.remove('empty-slot', 'shimmer');
                slots[i].classList.add('filled-slot');
                slots[i].innerHTML = `
                    <div class="flex flex-col h-full justify-center">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="bg-emerald-100 text-emerald-700 text-[9px] font-black px-2 py-0.5 rounded-md uppercase">Số ${i+1}</span>
                            <span class="text-[10px] text-slate-400 font-bold">${winner.id}</span>
                        </div>
                        <div class="font-black text-slate-800 text-sm uppercase truncate mb-1">${winner.name}</div>
                        <div class="text-[10px] text-slate-500 font-medium truncate uppercase tracking-tight">${winner.dept}</div>
                    </div>
                `;
                updateStats();
                updateHistoryList();
            }

            document.getElementById('draw-date').innerText = dateStr;
            document.getElementById('draw-time').innerText = timeStr;
            document.getElementById('draw-info').classList.remove('hidden');
            document.getElementById('spin-btn').classList.add('hidden');
            document.getElementById('after-draw-controls').classList.remove('hidden');
            isDrawing = false;
            document.getElementById('spin-btn').disabled = false;
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.7 } });
        }

        function updateHistoryList() {
            const body = document.getElementById('history-body');
            const search = document.getElementById('search-history').value.toLowerCase();
            
            const filtered = historyData.filter(h => 
                h.name.toLowerCase().includes(search) || 
                h.dept.toLowerCase().includes(search) ||
                h.picker.toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                body.innerHTML = '<tr><td colspan="4" class="p-10 text-center italic text-slate-400">Trống</td></tr>';
                return;
            }

            body.innerHTML = [...filtered].reverse().map((h, i) => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-3 text-center text-slate-300 font-bold">${filtered.length - i}</td>
                    <td class="p-3">
                        <div class="font-bold text-slate-800 uppercase truncate">${h.name}</div>
                        <div class="text-[9px] text-slate-400 truncate uppercase">${h.dept}</div>
                    </td>
                    <td class="p-3">
                        <div class="text-emerald-600 font-bold truncate">${h.picker}</div>
                    </td>
                    <td class="p-3 text-right text-slate-400 font-medium">${h.time}</td>
                </tr>
            `).join('');
        }

        function renderManageTable() {
            const body = document.getElementById('manage-body');
            const query = document.getElementById('search-manage').value.toLowerCase();
            const filtered = pool.filter(p => p.name.toLowerCase().includes(query) || p.id.toLowerCase().includes(query));
            
            body.innerHTML = filtered.map((p, idx) => `
                <tr class="hover:bg-slate-50 border-b border-slate-50">
                    <td class="p-4 text-center text-slate-400 font-bold">${idx + 1}</td>
                    <td class="p-4 font-bold text-slate-500">${p.id}</td>
                    <td class="p-4 font-black text-slate-800 uppercase">${p.name}</td>
                    <td class="p-4 text-slate-500 uppercase text-[10px]">${p.dept}</td>
                    <td class="p-4 text-center">
                        <button onclick="deletePersonnel('${p.id}')" class="text-red-400 font-bold uppercase text-[9px]">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        function deletePersonnel(id) {
            pool = pool.filter(p => p.id !== id);
            renderManageTable();
            updateStats();
        }

        function toggleAddForm() { document.getElementById('add-form').classList.toggle('hidden'); }

        function addNewPersonnel() {
            const id = document.getElementById('new-id').value.trim();
            const name = document.getElementById('new-name').value.trim();
            const dept = document.getElementById('new-dept').value.trim();
            if(!id || !name || !dept) return alert("Vui lòng điền đủ!");
            pool.unshift({ id, name, dept });
            toggleAddForm();
            renderManageTable();
            updateStats();
        }

        function handleCsvUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split(/\r?\n/);
                lines.forEach((line, i) => {
                    const cols = line.split(',').map(c => c.trim());
                    if (cols.length >= 3 && i > 0 && !pool.some(p => p.id === cols[0])) {
                        pool.push({ id: cols[0], name: cols[1], dept: cols[2] });
                    }
                });
                renderManageTable();
                updateStats();
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function confirmAndDownload() {
            const picker = document.getElementById('current-picker').value;
            const date = document.getElementById('draw-date').innerText;
            const time = document.getElementById('draw-time').innerText;
            
            let html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><style>
                    body { font-family: 'Times New Roman', serif; }
                    table { border-collapse: collapse; width: 100%; margin-top: 15px; }
                    th, td { border: 1px solid black; padding: 10px; font-size: 11pt; }
                </style></head>
                <body>
                    <h2 align="center">KẾT QUẢ QUAY SỐ</h2>
                    <p>Người quay: <b>${picker}</b> | Thời gian: <b>${time} - ${date}</b></p>
                    <table>
                        <tr><th>STT</th><th>Mã Số</th><th>Họ tên</th><th>Đơn vị</th></tr>
                        ${lastWinners.map((w, i) => `<tr><td align="center">${i+1}</td><td>${w.id}</td><td>${w.name.toUpperCase()}</td><td>${w.dept}</td></tr>`).join('')}
                    </table>
                </body></html>`;
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `KetQua_${time.replace(/:/g,'-')}.doc`;
            a.click();
        }

        function resetApp() {
            if (confirm("Xóa lịch sử phiên này và tải lại kho hồ sơ mặc định?")) {
                historyData = [];
                init();
                switchTab('draw');
            }
        }

        window.onload = init;
